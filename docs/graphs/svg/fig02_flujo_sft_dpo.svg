<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de datos y entrenamiento SFT/DPO</title>
  <desc id="desc">Diagrama de las dos etapas: SFT con 27 ejemplos y DPO de formato con 30 pares; el juez generó 0 pares usados.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8449"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F646B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#0E7490" opacity="0.75"/>
  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 2</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Flujo de datos y entrenamiento</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">SFT y DPO comparten el mismo adaptador; el DPO desplegado es de formato</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><text x="50" y="175" fill="#0E7490" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="2">SFT</text><rect x="50" y="195" width="200" height="105" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="50" y="207" width="4" height="81" fill="#0E7490" stroke-width="1" rx="2"/><text x="70" y="227" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">dataset_sft.jsonl</text><text x="70" y="252" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">30 ejemplos</text><rect x="275" y="195" width="200" height="105" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="275" y="207" width="4" height="81" fill="#0E7490" stroke-width="1" rx="2"/><text x="295" y="227" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">build_datasets()</text><text x="295" y="252" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">27 train / 3 eval</text><rect x="500" y="195" width="200" height="105" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="500" y="207" width="4" height="81" fill="#0E7490" stroke-width="1" rx="2"/><text x="520" y="227" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">train_format.jsonl</text><text x="520" y="252" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">27 con formato</text><rect x="725" y="195" width="200" height="105" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="725" y="207" width="4" height="81" fill="#0E7490" stroke-width="1" rx="2"/><text x="745" y="227" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">train_sft()</text><text x="745" y="252" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">20 pasos</text><text x="745" y="271" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">loss 1,967</text><rect x="950" y="195" width="200" height="105" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="950" y="207" width="4" height="81" fill="#0E7490" stroke-width="1" rx="2"/><text x="970" y="227" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">lora_adapter</text><text x="970" y="252" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">r=16 · α=32</text><text x="970" y="271" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">7 módulos</text><line x1="252" y1="247.5" x2="273" y2="247.5" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="477" y1="247.5" x2="498" y2="247.5" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="702" y1="247.5" x2="723" y2="247.5" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="927" y1="247.5" x2="948" y2="247.5" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><text x="50" y="355" fill="#B45309" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="2">DPO</text><rect x="20" y="375" width="178" height="112" fill="#F3F3EE" stroke="#B45309" stroke-width="1.4" rx="12"/><rect x="20" y="387" width="4" height="88" fill="#B45309" stroke-width="1" rx="2"/><text x="40" y="407" fill="#1A1A1A" font-size="13.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">train.jsonl</text><text x="40" y="432" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">27 prompts</text><rect x="218" y="375" width="178" height="112" fill="#F3F3EE" stroke="#B45309" stroke-width="1.4" rx="12"/><rect x="218" y="387" width="4" height="88" fill="#B45309" stroke-width="1" rx="2"/><text x="238" y="407" fill="#1A1A1A" font-size="13.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">candidates.jsonl</text><text x="238" y="432" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">10 prompts × 4</text><text x="238" y="451" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">= 40 candidatos</text><rect x="416" y="375" width="178" height="112" fill="#F3F3EE" stroke="#C0392B" stroke-width="1.4" rx="12"/><rect x="416" y="387" width="4" height="88" fill="#C0392B" stroke-width="1" rx="2"/><text x="436" y="407" fill="#1A1A1A" font-size="13.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">juez + reglas</text><text x="436" y="432" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">0 pares usados</text><rect x="614" y="375" width="178" height="112" fill="#F3F3EE" stroke="#B45309" stroke-width="1.4" rx="12"/><rect x="614" y="387" width="4" height="88" fill="#B45309" stroke-width="1" rx="2"/><text x="634" y="407" fill="#1A1A1A" font-size="13.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">dataset_dpo.jsonl</text><text x="634" y="432" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">30 de referencia</text><rect x="812" y="375" width="178" height="112" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="812" y="387" width="4" height="88" fill="#0E7490" stroke-width="1" rx="2"/><text x="832" y="407" fill="#1A1A1A" font-size="13.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">dpo_format.jsonl</text><text x="832" y="432" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">30 sintéticos</text><rect x="1010" y="375" width="178" height="112" fill="#F3F3EE" stroke="#1E8449" stroke-width="1.4" rx="12"/><rect x="1010" y="387" width="4" height="88" fill="#1E8449" stroke-width="1" rx="2"/><text x="1030" y="407" fill="#1A1A1A" font-size="13.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">train_dpo()</text><text x="1030" y="432" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">4 pasos</text><text x="1030" y="451" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">loss 0,6873</text><line x1="200" y1="431.0" x2="216" y2="431.0" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="398" y1="431.0" x2="414" y2="431.0" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="596" y1="431.0" x2="612" y2="431.0" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="794" y1="431.0" x2="810" y2="431.0" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="992" y1="431.0" x2="1008" y2="431.0" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-amber)"/><path d="M 505 491 L 505 565 L 901 565" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/><line x1="891" y1="555" x2="911" y2="575" stroke="#C0392B" stroke-width="2.2"/><line x1="911" y1="555" x2="891" y2="575" stroke="#C0392B" stroke-width="2.2"/><text x="520" y="555" fill="#C0392B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">0 pares: no llegan al artefacto</text><text x="520" y="580" fill="#C0392B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">data/dpo.jsonl == data/dataset_dpo.jsonl</text><rect x="50" y="590" width="1100" height="100" fill="#EDEDE8" stroke="#C9C9C2" stroke-width="1" rx="16"/><text x="72" y="622" fill="#1E8449" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="1.6">QUÉ SE DESPLEGÓ</text><text x="72" y="650" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">El adaptador final se fusionó con Qwen2.5-0.5B-Instruct y se exportó como GGUF F16.</text><text x="72" y="674" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">El DPO es de formato: chosen = ANALYZING + referencia + COMPLETE; rejected = referencia sin formato.</text><text x="60" y="730" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 2. No existen snapshots separados de SFT y DPO: ambos escriben en model/lora_adapter/.</text>
</svg>
