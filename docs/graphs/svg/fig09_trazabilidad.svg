<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
  <title id="title">Trazabilidad del artefacto SAMARITAN</title>
  <desc id="desc">Diagrama: modelo base, adaptador LoRA, fusión, GGUF y Ollama; el prompt desplegado no está versionado y difiere del Modelfile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8449"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F646B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#0E7490" opacity="0.75"/>
  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 9</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Trazabilidad del artefacto desplegado</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Los pesos tienen hash; el system prompt desplegado no está versionado en el repositorio</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><rect x="70" y="160" width="380" height="78" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="70" y="172" width="4" height="54" fill="#0E7490" stroke-width="1" rx="2"/><text x="90" y="192" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Qwen/Qwen2.5-0.5B-Instruct</text><text x="90" y="217" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">modelo base</text><text x="90" y="236" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">0.5B parámetros</text><rect x="70" y="265" width="380" height="78" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="70" y="277" width="4" height="54" fill="#0E7490" stroke-width="1" rx="2"/><text x="90" y="297" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Adaptador LoRA</text><text x="90" y="322" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">r=16 · α=32 · 7 módulos</text><text x="90" y="341" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">SFT + DPO de formato</text><rect x="70" y="370" width="380" height="78" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="70" y="382" width="4" height="54" fill="#0E7490" stroke-width="1" rx="2"/><text x="90" y="402" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">merge_adapter()</text><text x="90" y="427" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">fusión de pesos</text><text x="90" y="446" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">en fp32</text><rect x="70" y="475" width="380" height="78" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="70" y="487" width="4" height="54" fill="#0E7490" stroke-width="1" rx="2"/><text x="90" y="507" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">GGUF F16</text><text x="90" y="532" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">494,03M · 949 MB</text><text x="90" y="551" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">sha256 4495616c…</text><rect x="70" y="620" width="380" height="78" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="70" y="632" width="4" height="54" fill="#0E7490" stroke-width="1" rx="2"/><text x="90" y="652" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Ollama: samaritan:latest</text><text x="90" y="677" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">blob con el mismo hash</text><text x="90" y="696" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">modelo evaluado</text><line x1="260.0" y1="240" x2="260.0" y2="263" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="260.0" y1="345" x2="260.0" y2="368" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="260.0" y1="450" x2="260.0" y2="473" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="260.0" y1="555" x2="260.0" y2="618" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="550" y="165" width="570" height="160" fill="#EDEDE8" stroke="#C0392B" stroke-width="1.5" rx="12" stroke-dasharray="8 6"/><text x="575" y="196" fill="#C0392B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="1.3">SYSTEM PROMPT DESPLEGADO</text><text x="575" y="226" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">4.217 caracteres · 155 líneas</text><text x="575" y="252" fill="#5F646B" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">temperature = 0.1</text><text x="575" y="274" fill="#5F646B" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">top_p = 0.9 · repeat_penalty = 1.05</text><text x="575" y="300" fill="#C0392B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">NO versionado en el repositorio</text><rect x="550" y="375" width="570" height="160" fill="#EDEDE8" stroke="#B45309" stroke-width="1.4" rx="12" stroke-dasharray="8 6"/><text x="575" y="406" fill="#B45309" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="1.3">serving/Modelfile (en el repo)</text><text x="575" y="436" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">prompt distinto</text><text x="575" y="462" fill="#5F646B" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">temperature = 0.3</text><text x="575" y="484" fill="#5F646B" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">repeat_penalty = 1.1</text><text x="575" y="510" fill="#B45309" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">No es el prompt que se evaluó</text><text x="845" y="360" fill="#C0392B" font-size="34" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">≠</text><path d="M 550 245 L 500 245 L 500 620 L 455 620" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#arrow-red)"/><text x="510" y="330" fill="#C0392B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">prompt aplicado</text><path d="M 550 455 L 520 455 L 520 690" fill="none" stroke="#B45309" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-amber)"/><text x="525" y="700" fill="#B45309" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">no aplicado</text><rect x="70" y="735" width="1050" height="70" fill="#EDEDE8" stroke="#C9C9C2" stroke-width="1" rx="10"/><text x="90" y="763" fill="#1E8449" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Pesos trazables: el hash del GGUF coincide con el blob de Ollama.</text><text x="90" y="788" fill="#C0392B" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Prompt no trazable: el modelo evaluado no se reconstruye solo con el repositorio.</text><text x="60" y="835" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 9. La reproducibilidad del artefacto es parcial: cubre pesos, no configuración de inferencia.</text>
</svg>
