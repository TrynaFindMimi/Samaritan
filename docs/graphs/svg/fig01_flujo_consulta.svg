<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de consulta de SAMARITAN</title>
  <desc id="desc">Diagrama de flujo: usuario, agente, serving, Ollama, filtro y TUI, con las ramas de política.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8449"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F646B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#0E7490" opacity="0.75"/>
  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 1</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Flujo de una consulta</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Del mensaje del usuario a la respuesta filtrada que ve la TUI</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><rect x="45" y="235" width="165" height="112" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="45" y="247" width="4" height="88" fill="#0E7490" stroke-width="1" rx="2"/><text x="65" y="267" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">USUARIO / CLI</text><text x="65" y="292" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">main.py</text><text x="65" y="311" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">query · ask · REPL</text><rect x="235" y="235" width="165" height="112" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="235" y="247" width="4" height="88" fill="#0E7490" stroke-width="1" rx="2"/><text x="255" y="267" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">AGENTE</text><text x="255" y="292" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">SamaritanAgent</text><text x="255" y="311" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">historial + políticas</text><rect x="425" y="235" width="165" height="112" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="425" y="247" width="4" height="88" fill="#0E7490" stroke-width="1" rx="2"/><text x="445" y="267" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">SERVING</text><text x="445" y="292" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">ollama_client.py</text><text x="445" y="311" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">generate()</text><rect x="615" y="235" width="165" height="112" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="615" y="247" width="4" height="88" fill="#0E7490" stroke-width="1" rx="2"/><text x="635" y="267" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">OLLAMA LOCAL</text><text x="635" y="292" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">samaritan</text><text x="635" y="311" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">localhost:11434</text><rect x="805" y="235" width="165" height="112" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="805" y="247" width="4" height="88" fill="#0E7490" stroke-width="1" rx="2"/><text x="825" y="267" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">FILTRO</text><text x="825" y="292" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">output/filter.py</text><text x="825" y="311" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">finalize_output()</text><rect x="995" y="235" width="165" height="112" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="995" y="247" width="4" height="88" fill="#0E7490" stroke-width="1" rx="2"/><text x="1015" y="267" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">TUI</text><text x="1015" y="292" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">ui/tui.py</text><text x="1015" y="311" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">respuesta final</text><line x1="212" y1="291.0" x2="237" y2="291.0" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="402" y1="291.0" x2="427" y2="291.0" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="592" y1="291.0" x2="617" y2="291.0" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="782" y1="291.0" x2="807" y2="291.0" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="972" y1="291.0" x2="997" y2="291.0" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="45" y="420" width="1115" height="140" fill="#EDEDE8" stroke="#C9C9C2" stroke-width="1" rx="16"/><text x="70" y="455" fill="#B45309" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="1.6">RAMAS DE POLÍTICA</text><text x="70" y="488" fill="#1A1A1A" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">El agente intercepta comandos prohibidos y solicitudes destructivas antes de llamar al modelo.</text><text x="70" y="516" fill="#5F646B" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Esas ramas se detallan en las Figuras 7 y 8. La TUI solo recibe la salida ya filtrada.</text><text x="70" y="544" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Única frontera con el modelo: serving/ollama_client.py. Única frontera de contrato: output/filter.py.</text><text x="60" y="640" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 1. El filtro se aplica en todos los caminos, incluidos los errores y las ramas de política.</text><text x="60" y="662" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">La TUI no habla con Ollama: solo muestra texto que ya pasó por finalize_output().</text>
</svg>
