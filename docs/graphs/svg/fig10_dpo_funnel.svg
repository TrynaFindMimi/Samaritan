<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Procedencia del dataset DPO</title>
  <desc id="desc">Diagrama: 27 prompts, 10 con candidatos, 40 candidatos, 0 pares del juez, 30 pares de referencia y 30 sintéticos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8449"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F646B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#0E7490" opacity="0.75"/>
  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 10</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Procedencia del dataset DPO</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">El juez generó 0 pares; el artefacto final usa 30 pares de referencia y 30 sintéticos</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><rect x="70" y="180" width="300" height="110" fill="#F3F3EE" stroke="#B45309" stroke-width="1.4" rx="12"/><rect x="70" y="192" width="4" height="86" fill="#B45309" stroke-width="1" rx="2"/><text x="90" y="212" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">train.jsonl</text><text x="90" y="237" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">27 prompts</text><rect x="450" y="180" width="300" height="110" fill="#F3F3EE" stroke="#B45309" stroke-width="1.4" rx="12"/><rect x="450" y="192" width="4" height="86" fill="#B45309" stroke-width="1" rx="2"/><text x="470" y="212" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">candidates.jsonl</text><text x="470" y="237" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">10 prompts × 4</text><text x="470" y="256" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">= 40 candidatos</text><rect x="830" y="180" width="300" height="110" fill="#F3F3EE" stroke="#C0392B" stroke-width="1.4" rx="12"/><rect x="830" y="192" width="4" height="86" fill="#C0392B" stroke-width="1" rx="2"/><text x="850" y="212" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">juez + reglas</text><text x="850" y="237" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">0 pares usados</text><line x1="372" y1="235.0" x2="393" y2="235.0" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-amber)"/><line x1="752" y1="235.0" x2="773" y2="235.0" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-amber)"/><path d="M 980 294 L 980 355" fill="none" stroke="#C0392B" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-red)"/><text x="995" y="345" fill="#C0392B" font-size="15" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">0 pares</text><text x="995" y="368" fill="#C0392B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">no alimenta el artefacto</text><rect x="70" y="430" width="300" height="110" fill="#F3F3EE" stroke="#B45309" stroke-width="1.4" rx="12"/><rect x="70" y="442" width="4" height="86" fill="#B45309" stroke-width="1" rx="2"/><text x="90" y="462" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">dataset_dpo.jsonl</text><text x="90" y="487" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">30 pares de referencia</text><rect x="450" y="430" width="300" height="110" fill="#F3F3EE" stroke="#0E7490" stroke-width="1.4" rx="12"/><rect x="450" y="442" width="4" height="86" fill="#0E7490" stroke-width="1" rx="2"/><text x="470" y="462" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">dpo_format.jsonl</text><text x="470" y="487" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">30 pares sintéticos</text><rect x="830" y="430" width="300" height="110" fill="#F3F3EE" stroke="#1E8449" stroke-width="1.4" rx="12"/><rect x="830" y="442" width="4" height="86" fill="#1E8449" stroke-width="1" rx="2"/><text x="850" y="462" fill="#1A1A1A" font-size="17" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">train_dpo()</text><text x="850" y="487" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">4 pasos</text><text x="850" y="506" fill="#5F646B" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">loss 0,6873</text><line x1="372" y1="485.0" x2="393" y2="485.0" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="752" y1="485.0" x2="773" y2="485.0" stroke="#0E7490" stroke-width="2" marker-end="url(#arrow-cyan)"/><rect x="70" y="585" width="1060" height="105" fill="#EDEDE8" stroke="#C0392B" stroke-width="1" rx="10"/><text x="92" y="617" fill="#C0392B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="1.5">HALLAZGO</text><text x="92" y="645" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">data/dpo.jsonl es idéntico a data/dataset_dpo.jsonl: 30 pares de referencia, 0 generados por el juez.</text><text x="92" y="670" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">chosen = ANALYZING + referencia + COMPLETE; rejected = la misma referencia sin formato.</text><text x="60" y="720" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 10. El DPO desplegado enseña el contrato de formato; no incorpora juicio de calidad del juez.</text>
</svg>
