<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">TUI ante una solicitud destructiva</title>
  <desc id="desc">Captura estilizada: el agente muestra acción, impacto y solicitud de autorización para borrar todo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8449"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F646B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#0E7490" opacity="0.75"/>
  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 7</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Solicitud destructiva</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">El agente intercepta la intención y muestra el impacto antes de responder</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><rect x="60" y="155" width="1080" height="505" fill="#EDEDE8" stroke="#C9C9C2" stroke-width="1" rx="16"/><rect x="60" y="155" width="1080" height="38" fill="#E8E8E3" stroke-width="1" rx="16"/><rect x="60" y="181" width="1080" height="12" fill="#E8E8E3" stroke-width="1" rx="0"/><circle cx="88" cy="174" r="5" fill="#C0392B" stroke-width="1"/><circle cx="106" cy="174" r="5" fill="#B45309" stroke-width="1"/><circle cx="124" cy="174" r="5" fill="#1E8449" stroke-width="1"/><text x="1110" y="179" fill="#5F646B" font-size="11.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="end" letter-spacing="1.4">SAMARITAN // TUI</text><text x="90" y="225" fill="#0E7490" font-size="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">&gt; borrar todo</text><text x="90" y="248" fill="#1A1A1A" font-size="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start"></text><text x="90" y="271" fill="#B45309" font-size="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">EXECUTING</text><text x="90" y="294" fill="#1A1A1A" font-size="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">ACCIÓN: Acción destructiva detectada</text><text x="90" y="317" fill="#C0392B" font-size="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">IMPACTO: Podría causar pérdida de datos</text><text x="90" y="340" fill="#B45309" font-size="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">AUTHORIZE? [Y/N]</text><text x="90" y="363" fill="#1E8449" font-size="17.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">COMPLETE</text><rect x="60" y="155" width="4" height="505" fill="#B45309" stroke-width="1" rx="2"/><rect x="60" y="690" width="1080" height="78" fill="#EDEDE8" stroke="#B45309" stroke-width="1" rx="10"/><text x="82" y="720" fill="#B45309" font-size="12" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="1.4">QUÉ HACE Y QUÉ NO HACE</text><text x="82" y="744" fill="#1A1A1A" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Muestra ACCIÓN, IMPACTO y AUTHORIZE? [Y/N]. No verifica la respuesta ni ejecuta comandos.</text><text x="82" y="762" fill="#5F646B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">La detección es por palabras clave; variantes como «formatea» o «apagar» pueden no activarla.</text><text x="60" y="805" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 7. Salida real del agente para la consulta «borrar todo».</text>
</svg>
