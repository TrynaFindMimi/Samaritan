<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Composición de los datos de SAMARITAN</title>
  <desc id="desc">Barras horizontales: SFT 27/3, DPO 30 de referencia, 30 de formato, 0 del juez, 40 candidatos y 30 prompts de evaluación.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8449"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F646B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#0E7490" opacity="0.75"/>
  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 11</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Composición de los datos</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Muestra pequeña: 30 ejemplos SFT y 30 pares DPO de referencia, más 30 sintéticos</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><rect x="560" y="149" width="14" height="14" fill="#0E7490" stroke-width="1" rx="3"/><text x="584" y="161" fill="#1A1A1A" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">entrenamiento</text><rect x="720" y="149" width="14" height="14" fill="#B45309" stroke-width="1" rx="3"/><text x="744" y="161" fill="#1A1A1A" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">evaluación / referencia</text><rect x="930" y="149" width="14" height="14" fill="#1E8449" stroke-width="1" rx="3"/><text x="954" y="161" fill="#1A1A1A" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">sintético</text><text x="300" y="218" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">SFT: train / eval</text><line x1="320" y1="205" x2="320" y2="229" stroke="#C9C9C2" stroke-width="1"/><rect x="320" y="202" width="533.25" height="24" fill="#0E7490" stroke-width="1" rx="4" opacity="0.95"/><rect x="853.25" y="202" width="59.25" height="24" fill="#B45309" stroke-width="1" rx="4" opacity="0.95"/><text x="1124" y="220" fill="#1A1A1A" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">30</text><text x="300" y="270" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">DPO: referencia</text><line x1="320" y1="257" x2="320" y2="281" stroke="#C9C9C2" stroke-width="1"/><rect x="320" y="254" width="592.5" height="24" fill="#B45309" stroke-width="1" rx="4" opacity="0.95"/><text x="1124" y="272" fill="#1A1A1A" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">30</text><text x="300" y="322" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">DPO: formato</text><line x1="320" y1="309" x2="320" y2="333" stroke="#C9C9C2" stroke-width="1"/><rect x="320" y="306" width="592.5" height="24" fill="#1E8449" stroke-width="1" rx="4" opacity="0.95"/><text x="1124" y="324" fill="#1A1A1A" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">30</text><text x="300" y="374" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">DPO: juez</text><line x1="320" y1="361" x2="320" y2="385" stroke="#C9C9C2" stroke-width="1"/><rect x="320" y="366" width="3" height="8" fill="#C0392B" stroke-width="1" rx="1"/><text x="1124" y="376" fill="#1A1A1A" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">0</text><text x="300" y="426" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">Candidatos</text><line x1="320" y1="413" x2="320" y2="437" stroke="#C9C9C2" stroke-width="1"/><rect x="320" y="410" width="790.0" height="24" fill="#6D28D9" stroke-width="1" rx="4" opacity="0.95"/><text x="1124" y="428" fill="#1A1A1A" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">40</text><text x="300" y="478" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="end">Prompts de eval</text><line x1="320" y1="465" x2="320" y2="489" stroke="#C9C9C2" stroke-width="1"/><rect x="320" y="462" width="592.5" height="24" fill="#1D4ED8" stroke-width="1" rx="4" opacity="0.95"/><text x="1124" y="480" fill="#1A1A1A" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">30</text><line x1="320" y1="496" x2="1110" y2="496" stroke="#C9C9C2" stroke-width="1"/><line x1="320.0" y1="490" x2="320.0" y2="496" stroke="#5F646B" stroke-width="1"/><text x="320.0" y="516" fill="#5F646B" font-size="11.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="middle">0</text><line x1="517.5" y1="490" x2="517.5" y2="496" stroke="#5F646B" stroke-width="1"/><text x="517.5" y="516" fill="#5F646B" font-size="11.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="middle">10</text><line x1="715.0" y1="490" x2="715.0" y2="496" stroke="#5F646B" stroke-width="1"/><text x="715.0" y="516" fill="#5F646B" font-size="11.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="middle">20</text><line x1="912.5" y1="490" x2="912.5" y2="496" stroke="#5F646B" stroke-width="1"/><text x="912.5" y="516" fill="#5F646B" font-size="11.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="middle">30</text><line x1="1110.0" y1="490" x2="1110.0" y2="496" stroke="#5F646B" stroke-width="1"/><text x="1110.0" y="516" fill="#5F646B" font-size="11.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="middle">40</text><rect x="70" y="555" width="1060" height="100" fill="#EDEDE8" stroke="#C9C9C2" stroke-width="1" rx="10"/><text x="92" y="587" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="1.5">LECTURA</text><text x="92" y="615" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">El juez generó 0 pares. El DPO se entrenó con 30 pares de referencia convertidos a formato.</text><text x="92" y="640" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">30 ejemplos SFT y 30 pares DPO son una muestra pequeña: los resultados tienen alta varianza.</text><text x="60" y="690" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 11. Composición de los conjuntos usados en el entrenamiento y la evaluación.</text>
</svg>
