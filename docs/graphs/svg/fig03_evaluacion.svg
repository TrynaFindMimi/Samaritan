<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Evaluación comparativa de formato</title>
  <desc id="desc">Barras agrupadas: base por defecto, base con el prompt desplegado y Samaritan; métricas sin emojis, inicio raw y formato raw.</desc>
