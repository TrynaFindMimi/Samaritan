<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">TUI de SAMARITAN en modo interactivo</title>
  <desc id="desc">Captura estilizada de la terminal: logo, inicialización, consulta y respuesta completa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F7F5"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7490"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1E8449"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C0392B"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45309"/></marker>
    <marker id="arrow-bone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F646B"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6D28D9"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D4ED8"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#0E7490" opacity="0.75"/>
  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 6</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">TUI en modo interactivo</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Arranque, consulta y respuesta final después de finalize_output()</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><rect x="60" y="155" width="1080" height="505" fill="#EDEDE8" stroke="#C9C9C2" stroke-width="1" rx="16"/><rect x="60" y="155" width="1080" height="38" fill="#E8E8E3" stroke-width="1" rx="16"/><rect x="60" y="181" width="1080" height="12" fill="#E8E8E3" stroke-width="1" rx="0"/><circle cx="88" cy="174" r="5" fill="#C0392B" stroke-width="1"/><circle cx="106" cy="174" r="5" fill="#B45309" stroke-width="1"/><circle cx="124" cy="174" r="5" fill="#1E8449" stroke-width="1"/><text x="1110" y="179" fill="#5F646B" font-size="11.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="end" letter-spacing="1.4">SAMARITAN // TUI</text><text x="90" y="225" fill="#0E7490" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓</text><text x="90" y="248" fill="#0E7490" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">┃          ▓  S A M A R I T A N  ▓           ┃</text><text x="90" y="271" fill="#0E7490" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">┃      AUTONOMOUS TACTICAL RESPONSE UNIT     ┃</text><text x="90" y="294" fill="#0E7490" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛</text><text x="90" y="317" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start"></text><text x="90" y="340" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">[CORE] INITIALIZING OK</text><text x="90" y="363" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">[NET]  SECURE CHANNEL OK</text><text x="90" y="386" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">[ACL]  ACCESS CONTROL OK</text><text x="90" y="409" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">[ID]   PRIORITY: ADMIN OK</text><text x="90" y="432" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start"></text><text x="90" y="455" fill="#1E8449" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">&gt; SAMARITAN ONLINE</text><text x="90" y="478" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start"></text><text x="90" y="501" fill="#0E7490" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">&gt; Analiza el estado del sistema.</text><text x="90" y="524" fill="#0E7490" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">ANALYZING</text><text x="90" y="547" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">Los servicios esenciales responden. No se detectan</text><text x="90" y="570" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">procesos anómalos ni alertas críticas. La carga se</text><text x="90" y="593" fill="#1A1A1A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">mantiene dentro del rango previsto.</text><text x="90" y="616" fill="#1E8449" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="normal" text-anchor="start">COMPLETE</text><rect x="60" y="155" width="4" height="505" fill="#0E7490" stroke-width="1" rx="2"/><text x="60" y="690" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 6. Salida real de una consulta al modelo desplegado.</text><text x="60" y="712" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Los rótulos ACCESS CONTROL y PRIORITY: ADMIN son decorativos: no existe autenticación real.</text>
</svg>
