  <text x="60" y="44" fill="#0E7490" font-size="13" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="2.4">FIGURA 5</text><text x="60" y="82" fill="#1A1A1A" font-size="31" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Salida de evaluación</text><text x="60" y="110" fill="#5F646B" font-size="16" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Comparación de las tres variantes medidas con los 30 prompts fijos</text><line x1="60" y1="128" x2="1140" y2="128" stroke="#C9C9C2" stroke-width="1"/><rect x="60" y="170" width="1030" height="296" fill="#F3F3EE" stroke="#C9C9C2" stroke-width="1" rx="12"/><rect x="60" y="170" width="1030" height="72" fill="#E8E8E3" stroke-width="1" rx="12"/><rect x="60" y="230" width="1030" height="12" fill="#E8E8E3" stroke-width="1" rx="0"/><text x="74" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Versión</text><text x="279" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Sin emojis/!</text><text x="404" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Raw inicio</text><text x="519" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Raw estado</text><text x="634" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Raw formato</text><text x="759" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Final inicio</text><text x="884" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Final OK</text><text x="994" y="213" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Python</text><line x1="60" y1="242" x2="1090" y2="242" stroke="#C9C9C2" stroke-width="1"/><text x="74" y="285" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Base por defecto</text><text x="279" y="285" fill="#B45309" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">86.7%</text><text x="404" y="285" fill="#C0392B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">0.0%</text><text x="519" y="285" fill="#C0392B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">0.0%</text><text x="634" y="285" fill="#C0392B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">0.0%</text><text x="759" y="285" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="884" y="285" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="994" y="282" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="994" y="300" fill="#5F646B" font-size="10.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">n=0</text><line x1="60" y1="314" x2="1090" y2="314" stroke="#C9C9C2" stroke-width="1"/><text x="74" y="357" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Base + prompt</text><text x="279" y="357" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="404" y="357" fill="#B45309" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">90.0%</text><text x="519" y="357" fill="#B45309" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">90.0%</text><text x="634" y="357" fill="#C0392B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">36.7%</text><text x="759" y="357" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="884" y="357" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="994" y="354" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="994" y="372" fill="#5F646B" font-size="10.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">n=3</text><rect x="60" y="386" width="1030" height="72" fill="#DCEFF2" stroke-width="1" rx="0"/><line x1="60" y1="386" x2="1090" y2="386" stroke="#C9C9C2" stroke-width="1"/><text x="74" y="429" fill="#1A1A1A" font-size="14.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">Samaritan</text><text x="279" y="429" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="404" y="429" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="519" y="429" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="634" y="429" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="759" y="429" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="884" y="429" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="994" y="426" fill="#1E8449" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start">100.0%</text><text x="994" y="444" fill="#5F646B" font-size="10.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">n=2</text><rect x="60" y="500" width="1080" height="130" fill="#EDEDE8" stroke="#C9C9C2" stroke-width="1" rx="10"/><text x="80" y="532" fill="#0E7490" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start" letter-spacing="1.6">CÓMO LEER ESTA TABLA</text><text x="80" y="560" fill="#1A1A1A" font-size="14" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Base = qwen2.5:0.5b sin system prompt. Base + prompt = el mismo modelo con el prompt desplegado.</text><text x="80" y="586" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Final OK = 100% por finalize_output(); no mide al modelo. Python = 100% con n=0, 3 y 2: no es comparable.</text><text x="80" y="612" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">La fila de Samaritan es la única con formato raw completo en las 30 respuestas.</text><text x="60" y="675" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 5. Los porcentajes de Python no son una métrica de calidad: el denominador es el número de bloques detectados.</text>
</svg>
