xt-anchor="start">.............................                                      [100%]</text><text x="115" y="388" fill="#1E8449" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="600" text-anchor="start">29 passed in 0.51s</text><rect x="80" y="525" width="320" height="105" fill="#F3F3EE" stroke="#C9C9C2" stroke-width="1" rx="12"/><text x="104" y="570" fill="#1E8449" font-size="32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">29</text><text x="104" y="600" fill="#5F646B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="1.5">PASSED</text><rect x="430" y="525" width="320" height="105" fill="#F3F3EE" stroke="#C9C9C2" stroke-width="1" rx="12"/><text x="454" y="570" fill="#C0392B" font-size="32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">0</text><text x="454" y="600" fill="#5F646B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="1.5">FAILED</text><rect x="780" y="525" width="320" height="105" fill="#F3F3EE" stroke="#C9C9C2" stroke-width="1" rx="12"/><text x="804" y="570" fill="#0E7490" font-size="32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">0.51 s</text><text x="804" y="600" fill="#5F646B" font-size="12.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" text-anchor="start" letter-spacing="1.5">TIEMPO</text><text x="60" y="665" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Figura 4. Python 3.14.8 · 6 archivos de prueba · 29 tests, 0 fallos.</text><text x="60" y="687" fill="#5F646B" font-size="13.5" font-family="Inter, 'Segoe UI', Helvetica, Arial,